<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title> MÚSICA DE VIOLA CAIPIRA </title>

    <style>

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;

   background-color: #e3cf9f;
}


	.cabecalho {
		display: flex;
		align-items: flex-start; /* Alinha os elementos pelo topo */
		gap: 5px;
		padding: 10px;
}

        .logo {
            width: 280px;
            height: 250px;
            object-fit: contain;
        }


			h1{
				font-family: Georgia, serif;

				font-size: 55px;

				color: #5a3312;

				margin-top: 10px;
				margin-bottom: 20px;

				text-shadow:
					2px 2px 0px #d7b77d,
					4px 4px 6px rgba(0,0,0,0.25);
			}



			#pesquisa {
				width: 300px;
				height: 35px;
				padding: 5px 10px;
				font-size: 20px;
			}

        /* LISTA */
			#secao {
				list-style: none;
				padding: 0;
				margin: -100px 0 0 300px;
				width: 300px;
				text-decoration: none;	
			}

        #secao li {
            margin-bottom: 5px;
        }

			/* BOTÃO ESTILO TÁBUA */
			.musica {
				display: inline-flex;
				align-items: center;

				width: 600px;
				padding: 12px 15px;
				font-size: 18px;
				text-decoration: none;

				border-radius: 4x;

				border: 0px solid #4a2c12;

				background: linear-gradient(
					to bottom,
					#9c6a3b,
					#7a4a20,
					#5e3415
				);

    color: #fff8dc;

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.15),
        inset 0 -2px 2px rgba(0,0,0,0.3),
        3px 3px 8px rgba(0,0,0,0.4);

    transition: all 0.3s;
}

        /* ÍCONE */
			.icone {
				width: 24px;
				height: 24px;

				margin-right: 10px;

				flex-shrink: 0;
			}

			.icone-musical{
				font-size: 22px;
				margin-right: 12px;
				color: #fff8dc;
			}


    </style>

</head>

<body>


    <!-- CABEÇALHO -->
    <div class="cabecalho">
        <!-- 1. A logo vem primeiro para ficar na esquerda -->
        <img
            src="Ícones/Viola Caipira - AVC.png"
            class="logo"
            alt="Pitanga Viola">

        <!-- 2. Esta div agrupa o título e a pesquisa na direita, um acima do outro -->
        <div class="conteudo-direita">
            <h1>MÚSICA RAIZ</h1> 
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar Índice...">
        </div>

    </div>


    <!-- LISTA DAS MÚSICAS -->

    <ul id="secao"></ul>


    <script>

        /* =====================================================
           RELAÇÃO DAS MÚSICAS
           ===================================================== */

        const musicas = [  	

			{ nome: "BOIADEIRO ERRANTE - TOADA", cor: "verde" },
			{ nome: "BRASIL CABOCLO - TOADA", cor: "verde" },
			{ nome: "CABOCLA TEREZA - TOADA", cor: "verde" },
			{ nome: "CANOEIRO - CURURÚ", cor: "verde" },
			{ nome: "CHICO MINEIRO - TOADA", cor: "verde" },
			{ nome: "COURO DE BOI - TOADA", cor: "verde" },
			{ nome: "CUITELINHO - TOADA", cor: "verde" },
			{ nome: "ESTRADA DA VIDA - VALSA", cor: "verde" },
			{ nome: "FRANGUINHO NA PANELA - QUERUMANA", cor: "verde" },
			{ nome: "MEU VELHO PAI - TOADA", cor: "verde" },
			{ nome: "RAINHA DO PARANÁ - CURURÚ", cor: "verde" },
			{ nome: "VELHA PORTEIRA - VALSA", cor: "verde" },
			{ nome: "VELHO PAI - GUARÂNIA", cor: "verde" }
			
        ];


        /* =====================================================
           GERA A LISTA
           ===================================================== */

        const lista = document.getElementById("secao");


        function gerarLista() {

            lista.innerHTML = "";


            musicas.forEach(function(musica) {

                const li = document.createElement("li");


                const link = document.createElement("a");

                link.className = "musica " + musica.cor;


                /*
                   O nome do arquivo é o mesmo nome da Músicas
                */

                link.href =
                    "Músicas/" +
                    encodeURIComponent(musica.nome) +
                    ".html";


					/* ÍCONE DO DOCUMENTO */

							link.innerHTML = `
								<span class="icone-musical">♫</span>
								${musica.nome}
							`;


			li.appendChild(link);

			lista.appendChild(li);

		});

	}


		/* GERA A LISTA */

		gerarLista();


        /* =====================================================
           PESQUISA
           ===================================================== */

        document
            .getElementById("pesquisa")
            .addEventListener("input", function() {

                const texto =
                    this.value.toLowerCase();


                const itens =
                    document.querySelectorAll("#secao li");


                itens.forEach(function(item) {

                    const nome =
                        item.innerText.toLowerCase();


                    if (nome.includes(texto)) {

                        item.style.display = "";

                    } else {

                        item.style.display = "none";

                    }

                });

            });

    </script>


</body>

</html>
