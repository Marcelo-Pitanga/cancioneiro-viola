<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title> MÚSICA DE VIOLA CAIPIRA </title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

.cabecalho {
    display: flex;
    align-items: flex-start; /* Alinha os elementos pelo topo */
    gap: 5px;
    padding: 10px;
}

        .logo {
            width: 280px;
            height: 250px;
            object-fit: contain;
        }

        #pesquisa {
            width: 400px;
            height: 30px;
            padding: 5px 5px;
            font-size: 20px
        }

        /* LISTA */
        #secao {
            list-style: none;
            padding: 0;
            margin: 0 0 0 280px;
            width: 300px;
        }

        #secao li {
            margin-bottom: 5px;
        }

        /* BOTÃO */
        .musica {
            display: inline-flex;
            align-items: center;
            width: 550px;
            padding: 5px 5px;
            border-radius: 10px;
            font-size: 15px;
            text-decoration: none;
            box-sizing: border-box;
        }

        /* CORES */

        .verde {
            background-color: #00A443;
            color: white;
        }

        .azul {'
            background-color: #00FFFF;
            color: black;
        }

        /* ÍCONE */
        .icone {
            width: 24px;
            height: 24px;

            margin-right: 10px;

            flex-shrink: 0;
        }

    </style>

</head>

<body>


    <!-- CABEÇALHO -->
    <div class="cabecalho">
        
        <!-- 1. A logo vem primeiro para ficar na esquerda -->
        <img
            src="Ícones/VIOLA_CAIPIRA_Amigos do Vale Catarinense.jpg"
            class="logo"
            alt="Pitanga Viola">

        <!-- 2. Esta div agrupa o título e a pesquisa na direita, um acima do outro -->
        <div class="conteudo-direita">
            <h1>MÚSICA RAIZ</h1> 
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar Índice...">
        </div>

    </div>


    <!-- LISTA DAS MÚSICAS -->

    <ul id="secao"></ul>


    <script>

        /* =====================================================
           RELAÇÃO DAS MÚSICAS
           ===================================================== */

        const musicas = [

            { nome: "A CANETA E A ENXADA", cor: "verde" },
			{ nome: "A CAPA DO VIAJANTE", cor: "verde" },
			{ nome: "A ESTRADA DO SERTÃO", cor: "verde" },
			{ nome: "A FLOR E O BEIJA FLOR", cor: "verde" },
			{ nome: "A GAIVOTA", cor: "verde" },
			{ nome: "A MAJESTADE O SABIÁ", cor: "verde" },
			{ nome: "A MÃO DO TEMPO", cor: "verde" },
			{ nome: "A MARCA DA FERRADURA", cor: "verde" },
			{ nome: "A MODA DA MULA PRETA", cor: "verde" },
			{ nome: "A NOITE DO NOSSO AMOR", cor: "verde" },
			{ nome: "A PORTEIRA", cor: "verde" },
			{ nome: "A SAUDADE É UMA ESTRADA LONGA", cor: "verde" },
			{ nome: "A SEMENTE DO AMOR", cor: "verde" },
			{ nome: "A SEMENTINHA", cor: "verde" },
			{ nome: "A VACA JÁ FOI PRO BREJO", cor: "verde" },
			{ nome: "A VOLTA DO BOIADEIRO", cor: "verde" },
			{ nome: "A VOLTA DO FILHO", cor: "verde" },
			{ nome: "ADEUS MORENA ADEUS", cor: "verde" },
			{ nome: "ADEUS PAPAI, ADEUS MAMÃE", cor: "verde" },
			{ nome: "AGENDA RABISCADA", cor: "verde" },
			{ nome: "AGUA NO LEITE", cor: "verde" },
			{ nome: "AINDA ONTEM CHOREI DE SAUDADE", cor: "verde" },
			{ nome: "ALELUIA   (HALLELUJAH)", cor: "verde" },
			{ nome: "ALÔ", cor: "verde" },
			{ nome: "AMARGURADO", cor: "verde" },
			{ nome: "AMOR DE PRIMAVERA", cor: "verde" },
			{ nome: "AMOR DE VIOLEIRO", cor: "verde" },
			{ nome: "AMOR DISTANTE", cor: "verde" },
			{ nome: "AMOR ETERNO", cor: "verde" },
			{ nome: "ANTES DE PERDER VOCÊ", cor: "verde" },
			{ nome: "ANUNCIAÇÃO", cor: "verde" },
			{ nome: "AQUELA PAREDE", cor: "verde" },
			{ nome: "ARRASTA UMA CADEIRA", cor: "verde" },
			{ nome: "ASA BRANCA", cor: "verde" },
			{ nome: "ASA DELTA   (Voo Livre )", cor: "verde" },
			{ nome: "ASSINO COM X", cor: "verde" },
			{ nome: "AURORA DO MUNDO", cor: "verde" },
			{ nome: "AVIÃO DAS NOVE", cor: "verde" },
			{ nome: "BARCO DE PAPEL", cor: "verde" },
			{ nome: "BEIJINHO DOCE", cor: "verde" },
			{ nome: "BERRANTE DE OURO", cor: "verde" },
			{ nome: "BESTA RUANA", cor: "verde" },
			{ nome: "BOIADEIRO ERRANTE", cor: "verde" },
			{ nome: "BORBOLETA ERRANTE", cor: "verde" },
			{ nome: "BRASIL CABOCLO", cor: "verde" },
			{ nome: "BUSCANDO A FELICIDADE", cor: "verde" },
			{ nome: "CABECINHA NO OMBRO", cor: "verde" },
			{ nome: "FRANGUINHO NA PANELA", cor: "verde" },
			{ nome: "INQUILÍNA DE VIOLEIRO", cor: "verde" },
			{ nome: "LEMBRANÇAS", cor: "verde" },
			{ nome: "MÃE DE CARVÃO", cor: "verde" },
			{ nome: "MEU RECANTO MEU PARAÍSO", cor: "verde" },
			{ nome: "O VÔO DO CONDOR", cor: "verde" },
			{ nome: "OBRAS DE POETA", cor: "verde" },
			{ nome: "PAINEIRA VELHA", cor: "verde" },
			{ nome: "PEITO SADIO", cor: "verde" },
			{ nome: "PIRILUME", cor: "verde" },
			{ nome: "QUERÊNCIA AMADA", cor: "verde" },
			{ nome: "RELÓGIO QUEBRADO", cor: "verde" },
			{ nome: "SINA DE VIOLEIRO", cor: "verde" },
			{ nome: "TOCANDO EM FRENTE", cor: "verde" },
			{ nome: "VELHO AMOR", cor: "verde" },
			{ nome: "VOCÊ VAI GOSTAR", cor: "verde" }			

        ];


        /* =====================================================
           GERA A LISTA
           ===================================================== */

        const lista = document.getElementById("secao");


        function gerarLista() {

            lista.innerHTML = "";


            musicas.forEach(function(musica) {

                const li = document.createElement("li");


                const link = document.createElement("a");

                link.className = "musica " + musica.cor;


                /*
                   O nome do arquivo é o mesmo nome da Músicas
                */

                link.href =
                    "Músicas/" +
                    encodeURIComponent(musica.nome) + ".html";


                /* ÍCONE DO DOCUMENTO */

                link.innerHTML = `

                    <svg
                        class="icone"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M6 2h8l4 4v16H6z"></path>

                        <path d="M14 2v5h5"></path>

                        <line
                            x1="9"
                            y1="12"
                            x2="15"
                            y2="12">
                        </line>

                        <line
                            x1="9"
                            y1="16"
                            x2="15"
                            y2="16">
                        </line>

                        <line
                            x1="9"
                            y1="20"
                            x2="13"
                            y2="20">
                        </line>

                    </svg>

                    ${musica.nome}

                `;


                li.appendChild(link);

                lista.appendChild(li);

            });

        }


        /* GERA A LISTA */

        gerarLista();


        /* =====================================================
           PESQUISA
           ===================================================== */

        document
            .getElementById("pesquisa")
            .addEventListener("input", function() {

                const texto =
                    this.value.toLowerCase();


                const itens =
                    document.querySelectorAll("#secao li");


                itens.forEach(function(item) {

                    const nome =
                        item.innerText.toLowerCase();


                    if (nome.includes(texto)) {

                        item.style.display = "";

                    } else {

                        item.style.display = "none";

                    }

                });

            });

    </script>


</body>

</html>
